name: CI

on:
  push:
  pull_request:

# If you push again while a run is still going, cancel the old one —
# faster feedback, no wasted minutes on stale commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip                 # cache downloaded packages between runs

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest

  docker:
    needs: test                      # only build if tests pass
    runs-on: ubuntu-latest
    # Only build & push on pushes to main, not on pull requests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Two tags: a moving 'latest' + an immutable one pinned to this commit
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ci-practice:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ci-practice:${{ github.sha }}
          # Reuse cached layers from previous runs to speed up rebuilds
          cache-from: type=gha
          cache-to: type=gha,mode=max
